# 版本目录 —— 轨 B（实测通过）
#
# 这套组合的成立条件很窄，改动前请先读 README 的「维护红线」：
#   * compileSdk 必须 37：Haze 2.0.1 的 KMP 变体会传递引入 androidx.compose.foundation:1.12.1，
#     其 AAR metadata 声明 minCompileSdk=37。配 36 直接编译失败，与选哪条轨无关。
#   * AGP 9 内置 Kotlin 固定 2.2.10，必须用根 build.gradle.kts 的 buildscript classpath 抬到 2.3.21。
#   * KSP 2.3.x 起是独立版本号，旧的 "2.2.10-2.0.2" 格式会报 kotlin.sourceSets 错误。

[versions]
agp = "9.1.1"
kotlin = "2.3.21"
ksp = "2.3.12"
composeBom = "2026.05.01"
haze = "2.0.1"
room = "2.7.2"
hilt = "2.60.1"
hiltNavCompose = "1.2.0"
navigation = "2.8.9"
datastore = "1.1.7"
lifecycle = "2.8.7"
coroutines = "1.9.0"
serialization = "1.7.3"
okhttp = "4.12.0"
coreKtx = "1.15.0"
activityCompose = "1.9.3"
password4j = "1.8.3"
profileinstaller = "1.4.1"
junit4 = "4.13.2"
turbine = "1.2.0"
coroutinesTest = "1.9.0"
robolectric = "4.13"
sqlcipher = "4.7.2"
androidxTestExt = "1.2.1"
espresso = "3.6.1"
androidxTestRunner = "1.6.2"
uiautomator = "2.3.0"
# 2026-11-01: 1.3.3 在 API 36 上无法确认启动完成（framestats 解析不兼容），升到 1.4.1
benchmark = "1.4.1"
kover = "0.9.11"

[libraries]
# --- Compose ---
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-util = { module = "androidx.compose.ui:ui-util" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons = { module = "androidx.compose.material:material-icons-extended" }

# --- Liquid Glass 材质 ---
# 注意：Haze 2.0 没有 haze-materials 这个坐标，三件套是 haze / haze-blur / haze-blur-materials
haze = { module = "dev.chrisbanes.haze:haze", version.ref = "haze" }
haze-blur = { module = "dev.chrisbanes.haze:haze-blur", version.ref = "haze" }
haze-blur-materials = { module = "dev.chrisbanes.haze:haze-blur-materials", version.ref = "haze" }

# --- 基础设施 ---
core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }

# --- 数据 ---
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

# --- 网络 ---
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }

# --- 整库加密 ---
# ⚠️ 坐标不是 REBUILD_PLAN 里写的 net.zetetic:android-database-sqlcipher:4.7.2。
#    那个组合在 Maven Central 上**不存在**：旧 artifactId 最高只到 4.5.4，
#    4.7.2 属于新 artifactId `sqlcipher-android`（当前最新 4.20.0）。
#
#    选新库而非旧库的决定性理由是 16KB 页对齐（方案阶段 1 的验收项）：
#      旧库 4.5.4  LOAD p_align = 0x1000  → 不满足 Play 的 16KB 页要求
#      新库 4.7.2  LOAD p_align = 0x4000  → 满足
#    代价是体积：arm64 so 从 3.6MB 涨到 5.2MB（release APK 增量见文档）。
#
#    包名仍是 net.zetetic.database.sqlcipher，SupportOpenHelperFactory 与 Room 对接方式不变。
sqlcipher = { module = "net.zetetic:sqlcipher-android", version.ref = "sqlcipher" }

# --- 备份口令派生（纯 JVM，无 native，16KB 页友好）---
password4j = { module = "com.password4j:password4j", version.ref = "password4j" }

# --- DI ---
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavCompose" }

# --- 测试 ---
junit4 = { module = "junit:junit", version.ref = "junit4" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutinesTest" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExt" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
benchmark-macro = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmark" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
# 不声明 kotlin-android：AGP 9 内置 Kotlin，再 apply 会报 "Cannot add extension with name 'kotlin'"
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
