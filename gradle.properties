# 构建 JVM 与性能开关
#
# ⚠️ 内存每一项都经过实机校准，改动前先读下面的算式，不要凭感觉调大。
#
# 实机环境（2026-10-31 实测）：Windows 10 / i7-12700H（20 线程）/ 物理内存 15.73GB
# 事故记录：使用 -Xmx4g + parallel=true 时整机重启（Kernel-Power 41 / 0:28:28 非正常关机）。
# 成因：Gradle daemon 4G + Kotlin daemon 默认继承该 Xmx + 20 路并发 + KSP/Hilt 注解处理，
#      叠加系统与 IDE 常驻约 7GB，瞬时需求超出物理内存 + 9.7G 页面文件，触发硬重置。
#
# 当前预算（构建峰值约 3.6GB，给系统预留 4GB 以上）：
#   Gradle daemon 2g 堆 + 768m metaspace
#   Kotlin daemon 1.25g 堆（独立进程，必须单独限，否则会继承 Gradle 的堆上限）
#   并发最多 2 个 worker（20 核默认并发是本次事故的元凶）

org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Kotlin 编译进程单独限内存：不写这行，它默认按 Gradle daemon 的堆继续放大
kotlin.daemon.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=512m

# 并发必须显式压住。parallel 本身不危险，危险的是它按 CPU 核数（20）展开。
org.gradle.parallel=true
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configureondemand=true
# 配置缓存与自定义 Task 偶发冲突时，先临时置 false 定位，不要长期关闭
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
# 保留 R 类非传递：多模块下能压低方法数与编译耦合

kotlin.code.style=official
# 增量编译的跨模块快照会额外常驻内存，关掉换稳定性
kotlin.incremental.useClasspathSnapshot=false
