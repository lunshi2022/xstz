# 重建工程 gradle.properties
# 复制到 <repo>/gradle.properties
# 与旧文件的差异全部标注了原因，旧文件里 4 项应删除的配置见文末。

# --- JVM ---
# 旧值 -Xmx2048m 在 AGP 9 + KSP2 + Hilt 全量注解处理下极易 OOM；
# 旧值 org.gradle.degree_of_parallelism=16 会放大峰值内存占用，已移除。
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# --- 性能 ---
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
# 配置缓存：AGP 9 / KGP 2.2 / Hilt 均已支持。
# 若首次接入 Haze 或自定义 Gradle Task 触发报错，先临时置 false 定位，不要长期关闭。
org.gradle.configuration-cache=true

# --- Android ---
android.useAndroidX=true
android.nonTransitiveRClass=true
# 移除：android.suppressUnsupportedCompileSdk=34
# 该开关用于压制"compileSdk 高于 AGP 支持上限"的告警，当前 AGP 8.2 + compileSdk 34 本不该触发，
# 属历史残留；升级到新版后继续保留会掩盖真实的版本不匹配问题。

# --- Kotlin ---
kotlin.code.style=official

# 移除：systemProp.maven.repo.local=D:/LeStoreSoftstore/.../repository
# 硬编码绝对路径，换机/CI 直接失效，且会静默把本地仓库指向不存在的盘符。
# 需要自定义本地仓库请用 GRADLE_USER_HOME 环境变量。

# 移除：4 行空的 systemProp.http(s).proxyHost/Port
# 空值不生效但会干扰 IDE 的代理诊断，需要代理时再显式填写。
